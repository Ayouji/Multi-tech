version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - backend/.env
    restart: unless-stopped
    volumes:
      - backend-data:/app/data

volumes:
  backend-data: